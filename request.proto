// request.proto
syntax = "proto3";

import "common.proto";

// 定义包名，这会影响 Go 和其他语言的命名空间
package messages;

// 告诉 Go 生成器将文件放在当前目录(./)，并且包名是 messages
option go_package = "./;messages";

// 包装消息，包含所有可能的请求类型
// 因为客户端发送的消息会被统一的后端ws handler解析
// 再根据后端room的状态进行分支处理
message Request {
  // oneof 确保一个 Request 消息实例中，只有一个字段能被设置
  oneof payload {
    RequestChooseMap choose_map = 6;
    RequestLeaveChooseMap leave_choose_map = 9;
    
    RequestReady ready = 5;
    RequestLoaded loaded = 8;

    RequestBlank blank = 1;
    RequestCardPlant plant = 2;
    RequestRemovePlant remove_plant = 3;
    RequestStarShards star_shards = 4;

    RequestEndGame end_game = 7;

    // 等待房间（InLobby）内的房间管理请求
    RequestUpdateRoom update_room = 10;
    RequestKickPlayer kick_player = 11;

    // PostGame 结算后请求返回等待房间
    RequestReturnToLobby return_to_lobby = 12;

    // Loading 阶段：客户端加载进度（1..100，100=完全加载好等待同步）
    RequestPlayerLoaded player_loaded = 13;

    // 重连恢复：在线客户端响应服务端快照请求
    RequestSnapshotResponse snapshot_response = 14;
  }
}

// --- 以下是具体的消息定义，从你的 Go 代码翻译而来 ---

// RequestChooseMap 请求选择地图
// 房主客户端在选择地图时发送此请求
// 进入preparing阶段
message RequestChooseMap {
  uint32 chapter_id = 1;
  uint32 stage_id = 2;
}

// 退出选preparing阶段
message RequestLeaveChooseMap {}

// Ready 表示某个客户端在选卡界面切换准备就绪
message RequestReady {
  bool isReady = 1;
  // 开局确定性配置；服务端将其规范化后写入 AllReady 广播
  LoadoutSnapshot loadout = 2;
}

// Loaded 表示某个客户端加载完毕（兼容旧协议；新流程使用 player_loaded）
message RequestLoaded {
  bool isLoaded = 1;
}

// PlayerLoaded 表示某个客户端在 Loading 阶段的加载进度。
// 客户端在加载素材、音效与初始化战局的过程中持续上报，1..100 的整数；
// 100 表示完全加载好、正在等待其他玩家同步。
message RequestPlayerLoaded {
  uint32 progress = 1;
}



// ----------
// InGame 游戏中


// RequestBlank 用于心跳的空请求
// 每一个“不发送具体请求”的逻辑帧都应该发此请求
message RequestBlank {
  // 客户端需要把此帧插入的位置
  uint32 frame_id = 1;
  // 客户端上一次确认的帧
  uint32 ack_frame_id = 2;
  // 客户端对该帧的确定性状态摘要（FNV-1a 32 位低 32 位）；0 表示本次不携带
  uint32 state_hash = 3;
  // state_hash 对应的逻辑帧号
  uint32 hash_frame_id = 4;
  // 低频权威状态摘要：0 或空表示本次不携带
  string state_hash_hex = 5;
  // 与 state_hash_hex 对应的可恢复 inline 快照 JSON；空表示只上报摘要
  string inline_snapshot_json = 6;
  // 客户端确定性哈希口径版本（SimulationState.version）。
  // 0 表示旧客户端未上报；服务端发现版本不一致时应拒绝比较哈希。
  uint32 state_hash_version = 7;
  // 客户端统计的服务器往返延迟（毫秒）；0 表示未知。
  // 服务端用于挑选最低延迟的在线客户端作为重连快照来源。
  uint32 client_latency_ms = 8;
  // 客户端当前资源 profile：每帧心跳上报，服务端按玩家保存，
  // 供页面刷新后的重连恢复能量、星之碎片与卡槽冷却。
  uint32 energy = 9;
  uint32 star_shards = 10;
  repeated CardCooldownState card_cooldowns = 11;
  // 新客户端会置 true；旧客户端缺省 false 时不覆盖服务端已有 profile。
  bool resources_reported = 12;
}

// RequestGridOperation 格子操作请求
// 应该作为基类被其他请求继承
message RequestGridOperation {
  // 使用 RequestBlank 作为基础消息
  // 这表示这是一个心跳请求，包含了必要的帧信息
  RequestBlank base = 1;
  // 操作的格子列
  uint32 col = 2;
  // 操作的格子行
  uint32 row = 3;

  // 此操作应该在哪一帧时进行
  // 主动避让，避免多次的回溯
  uint32 process_frame_id = 4;

  // 客户端单调递增的操作序号，用于精确去重和失败回包关联
  uint32 client_op_seq = 5;
}

// RequestCardPlant 卡片种植请求
message RequestCardPlant {
  // 使用 RequestGridOperation 作为基础消息
  RequestGridOperation base = 1;

  // 卡片 ID
  uint32 pid = 2;

  // 卡片等级
  uint32 level = 3;

  // 此次操作带来的消耗
  // 消耗性将在得到响应前直接扣除
  // 只有在得到服务器说，此次操作失败才会返还
  int32 cost = 4;

  // 本次用户的阳光总数
  int32 EnergySum = 5;
  // 本次用户的星之碎片总数
  int32 StarShardsSum = 6;
}

// RequestRemovePlant 铲除植物请求
message RequestRemovePlant {
  // 使用 RequestGridOperation 作为基础消息
  RequestGridOperation base = 1;

  // 要铲除的植物 ID
  // 一个grid上有多个植物， 用植物的卡片id（非战局内实体id）
  uint32 pid = 2;

  // 铲除植物部分特性会有奖励
  // 因此只有在得知ResponseRemovePlant时才会让客户端产生奖励
}

message RequestStarShards {
  // 使用 RequestGridOperation 作为基础消息
  RequestGridOperation base = 1;

  // 施加星之能力卡片 ID
  // 一个grid上有多个植物， 用植物的卡片id（非战局内实体id）
  uint32 pid = 2;

  // 此次操作带来的消耗
  // 消耗性将在得到响应前直接扣除
  // 只有在得到服务器说，此次操作失败才会返还
  int32 cost = 3;

  // 本次用户的阳光总数
  int32 EnergySum = 4;
  // 本次用户的星之碎片总数
  int32 StarShardsSum = 5;
}

// 客户端本地游戏结束时告诉服务端
message RequestEndGame {
  uint32 game_result = 1; // 0: 失败, 1: 胜利
}

// 房主在等待房间内修改房间名与密码；仅房主有效
message RequestUpdateRoom {
  // 房间名，最长 6 个字符（服务端按 rune 截断）
  string name = 1;
  // 房间密码，空字符串表示公开房间；最长 8 个字符
  string key = 2;
}

// 房主将指定玩家移出房间
message RequestKickPlayer {
  uint32 player_id = 1;
}

// PostGame 结算后任一玩家可请求返回等待房间；房间重置回 InLobby，可再次准备开局
message RequestReturnToLobby {}

// 在线客户端响应服务端的重连快照请求。
// 服务端会把 inline_snapshot_json 转发给重连玩家，并补齐该帧到服务端权威帧之间的操作。
message RequestSnapshotResponse {
  // 对应 ResponseSnapshotRequest.request_id，用于丢弃过期响应
  uint32 request_id = 1;
  // 快照对应的客户端已执行帧号
  uint32 frame_id = 2;
  // InlineSnapshot JSON；空表示客户端当前无法提供快照
  string inline_snapshot_json = 3;
}
